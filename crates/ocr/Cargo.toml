[package]
name = "pdfcraft-ocr"
description = "Scan & OCR: recognise text in page images (ocrs) and write it as an invisible, searchable text layer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-fonts = { workspace = true }
# Both model formats: upstream deprecated the `.rten` files on 2026-10-27 and serves the ONNX
# ones (robertknight/ocrs#282), but an installation that still has the old files keeps working.
ocrs = { version = "0.13.1", default-features = false, features = ["rten", "onnx"] }
rten = { version = "0.26.0", default-features = false, features = ["rten_format", "onnx_format"] }
thiserror.workspace = true
