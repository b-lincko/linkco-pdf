[components.B024]
title = "Stop any background job, and see what every one of them is doing"
stage = "basic"
parent_tasks = ["REC-R04"]
status = "complete"
acceptance = "While the app is working on something that leaves the interface thread, one card at the bottom of the window names each job, says what it is doing now and how far it has got, and offers a Cancel that stops that job and no other; a stop is safe — the item in hand finishes and its file is written whole or not at all, no further item starts, and the card says Cancelling… until the worker reports — and it is answered the same way by the optimizer, by text recognition on one document, by text recognition on a folder of files, by an action run over files, and by an export; the same jobs and the same stop are on the agent control channel, so a script sees what the person sees and stops the job the person would; and nothing that runs off the interface thread can freeze editing while it runs."
notes = "Bounded part of REC-R04 (the cancellable background-job centre), which stays open for print jobs and for the Word, HTML and RTF conversions. Before this component the five kinds of background work each reported themselves in their own way, and only one of them could be stopped: the optimizer had a private card with a Cancel button, text recognition had a cancel flag but no button anywhere that reached it, and the other three rewrote a toast every few hundred milliseconds, which any ordinary notice then replaced. There is now one job centre (crates/ui-egui/src/jobs.rs): a job id, a cooperative stop request shared with the worker, the list the card draws and the control channel reports, and one batch loop every multi-item job runs, so a stop means the same thing everywhere. The card lists up to three jobs with their own eased progress bars (further ones are counted), the Cancel belongs to its own row and is withdrawn once a stop is asked for, and the toast is lifted above the card instead of over it. The jobs are also on the control channel: ui.state reports each job's id, kind, name, stage, done and total, fraction and whether a stop was asked for, and ui.jobs with {\"cancel\": id} asks one to stop and answers with the list. Four new strings (the folder-recognition name, the file stage, the stopped-after note and the counted remainder above three jobs) are in all sixteen catalogs, and the page stage reuses the catalogs' existing Page {p} of {n}."
code = ["crates/ui-egui/src/jobs.rs", "crates/ui-egui/src/widgets.rs", "crates/ui-egui/src/lib.rs", "crates/ui-egui/src/control.rs", "crates/ui-egui/src/optimize_ui.rs", "crates/ui-egui/src/ocr_ui.rs", "crates/ui-egui/src/actions_ui.rs", "crates/ui-egui/src/export_ui.rs", "crates/ui-egui/tests/ui.rs", "crates/ui-egui/tests/control.rs", "crates/ui-egui/tests/create.rs", "crates/ui-egui/src/i18n/*.tsv", "parity/acrobat-features.toml", "ATTRIBUTION.toml"]
audit = "Started from the recommendation's done-when — OCR, print, convert and batch jobs show stages, can cancel safely, and do not freeze editing — and asked, for each of the five kinds of work that leave the interface thread, three questions: does the reader see a stage, can they stop it, and can it hold up editing. The answers were uneven, and the audit named why. The optimizer had a card and a Cancel; text recognition had a cancel flag (`cancel_ocr`) that nothing in the interface ever called, so an OCR run could not be stopped at all; export and action runs reported into the toast, a single slot shared with every other notice, so a save confirmation hid the progress of the job that was running; the folder-based recognizer had no progress reporting beyond a lock the poll read. The four stop flags were four separate designs (an AtomicBool here, a `cancelled` field there, a closure returning false there), which is how the unevenness happened. Five decisions came out of that. One stop type (Cancel, an Arc around one AtomicBool) is shared by the card, the control channel and the worker, so a stop asked from a screen reader, from a script or from the card is one stop. One batch loop (run_batch) answers a stop the same way for every job: the item in hand finishes, no further item starts, and the outcome says whether anything was given up — so a stop that arrives after the last item is a finished batch, not a cancellation, and the summary does not claim otherwise. A stop is cooperative and answered between items, because an item is one page's recognition or one file's write and a job that cannot be interrupted must not pretend it can; nothing kills a thread. A job is registered before its worker starts and removed by the poll that was already waiting for it, so no watchdog is needed and a job that finishes in the same call (tests and automation run inline) never leaves a row behind. And the card is the report: the same list is drawn on screen and serialized on the control channel, so an agent cannot see a job a person does not, or stop a different one. Re-audit found four faults of this component's own, all fixed here: the export registered its job before the folder picker returned, so dismissing the picker would leave a ghost row with no worker — registration moved inside the branch that knows the folder; the Host trait grew the two new methods twice (a duplicate block from the same edit) — the copy is gone; ActionRun carried a stale Default derive after it gained a job id, which cannot default — the derive and the stray doc comment are gone; and the folder recognition's summary counted only files it wrote while the wording said \"in {n} files\", which is now the same number the loop reports. Two smaller corrections: a stopped export now says so in the sentence the toast already wraps in \"to {dir}\", and cancel_ocr stops the folder batch as well as the single document, since both are recognitions the reader started. Three more came from CI and from the new tests. The export test showed that a stop between pages reported the count from before the page in hand, so the card said 0 of 2 after one file had been written: the count is now stored before the stop is answered. The Czech catalog test refuses leading or trailing whitespace in a translation, and the stopped-after note begins with a space because it is a suffix, so that entry is not in the Czech catalog, which covers the menus only; the other fifteen carry it. And the card test is about routing rather than clicking after all: a click on one of two identical Cancel labels, and then on the single one left, cancelled nothing in that harness even with a document open, while the optimizer card test's click on the one Cancel of a one-job card works, so the multi-row test drives the stop through the call show_progress makes (cancel_job with the clicked row's id) and leaves the click itself to that test; the finding — that a synthetic click on this card is not reliable in the harness — is recorded rather than papered over. The audit also noted a drift it did not cause: docs/localization.md still describes the catalogs as holding 2,000-2,140 entries and names 2,047 for Ukrainian, 2,000 for Brazilian Portuguese and 2,137 for Arabic, while the sixteen files now hold 2,215-2,233 each, so those figures have been stale for some components and no test reads them; the counts are left as written rather than replaced by numbers this component would have to keep current by hand."
local_evidence = [
    "cargo fmt --all -- --check passes",
    "crates/ui-egui/src/jobs.rs::a_stop_request_is_shared_idempotent_and_never_goes_back proves one flag behind every clone, and that asking twice does nothing new",
    "crates/ui-egui/src/jobs.rs::a_batch_stops_before_the_next_item_and_keeps_what_it_finished stops during the second of four items and shows that exactly two started, both finished, and the outcome says the batch was cancelled",
    "crates/ui-egui/src/jobs.rs::a_batch_stopped_before_it_starts_touches_nothing, ::a_batch_records_each_failure_and_carries_on, ::a_stop_that_arrives_after_the_last_item_is_not_a_cancellation and ::progress_is_reported_before_each_item cover the other three edges of the stop contract and the progress the card is given",
    "crates/ui-egui/src/jobs.rs::the_centre_lists_what_is_running_and_forgets_what_finished registers two jobs, stages one, refuses a NaN fraction, cancels one and proves the other untouched, then refuses to cancel a finished job",
    "crates/ui-egui/src/optimize_ui.rs::the_progress_card_shows_the_stage_and_cancels drives the card through a real shell: the row reads \"Optimize PDF…: Optimizing… image 4 of 10\" at the stage's own 0.275 fraction, Cancel asks the worker's token and the row becomes \"Optimize PDF…: Cancelling…\" with no second Cancel, and the row goes when the worker reports",
    "crates/ui-egui/tests/ui.rs::the_jobs_card_lists_each_job_and_shows_which_one_is_stopping lists two concurrent jobs with a Cancel each, stops one by its row id — the call show_progress makes with the clicked row's id — and proves the other job's worker was not asked to stop, that the stopped row says Cancelling… and offers no second Cancel, that only the running job is still offered one, and that finishing a job removes only its own row",
    "crates/ui-egui/tests/control.rs::jobs_are_listed_and_stopped_one_at_a_time reads the jobs back through ui.state and ui.jobs, stops one of two by id, and gets an error rather than silence for a job that is not running and for a cancel that is not an id",
    "crates/ui-egui/src/export_ui.rs::a_stop_between_pages_keeps_the_page_in_hand_and_starts_no_other stops an export while its first page is being written and shows that the first page's PNG was written whole, the second page never started, and the message and the card both say 1 of 2",
    "crates/ui-egui/src/export_ui.rs::a_stop_before_the_first_page_writes_nothing shows a stop that arrives before the first page writes no file at all",
    "python3 docs/implementation/build_backlog.py --check passes, and python3 -m unittest discover -s docs/implementation -p 'test_*.py' passes",
    "All 247 recorded asset SHA-256s match their files, including the sixteen edited catalogs",
]
