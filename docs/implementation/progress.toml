[components.B022]
title = "One malformed page or a failed export does not spoil the rest"
stage = "basic"
parent_tasks = ["REC-R06"]
status = "ci_pending"
acceptance = "A page the renderer refuses says why on the page, states how often it has been tried, and is retried on a short backoff a bounded number of times instead of being either given up on at the first error or asked for again for ever; an edit, a rotation or a zoom tries it again; only that page is reported, and neighbouring pages, thumbnails, print previews and other open documents keep drawing; and an export that fails reports why, leaves the document open and unchanged, and the next export to a real folder works."
notes = "Bounded part of REC-R06 (recoverable per-document operation failures), which stays open. What this closes is the page that was broken for the life of the tab: a renderer refusal was stored as a bare string and cleared only by an edit, so a failure with a passing cause — a retired worker, a brief allocation failure, a page that lost its race with a resize — left the page blank until the document was reopened, while the comment on the field said it was 'never re-requested' and the demand loop went on demanding it every frame. A failure is now a record: the reason, the demand that failed, how many attempts it has had and when the next is due. It is retried after 1 s and 4 s and then waits for the demand to change, so a page that is genuinely broken costs two extra renders rather than one per frame, and thumbnails and print previews — which used to be blocked for that page for ever — follow the same schedule. Changing the view (a zoom, a rotation), editing the page or reopening it tries again, and the page says how often it was tried. Still open in REC-R06: a job centre that lists work in progress and cancels it, per-document transaction rollback beyond the atomic save, a diagnostics bundle, and recovery from a renderer panic inside a worker beyond the existing worker replacement."
code = ["crates/ui-egui/src/canvas.rs", "crates/ui-egui/tests/viewer.rs", "crates/automation/tests/automation.rs", "crates/ui-egui/src/i18n/*.tsv", "parity/acrobat-features.toml"]
audit = "Started from the recommendation's acceptance line — one malformed page or a failed export leaves other tabs and the original document usable — and asked what the interface does with a failure today. `DocView.errors` was a `HashMap<usize, String>`: set once by `receive_result`, cleared only by `page_changed` (an edit) or `invalidate_content`, and used in three other places as a permanent 'do not ask again' flag. Four defects came out. (1) A failure with a passing cause was permanent: the page stayed blank, with its error box, until the document was reopened — the one recovery the reader had was to close the file. (2) The field's own comment said 'never re-requested', but the demand loop in `draw` pushed the page's raster every frame and only the queue's de-duplication (`if queue != last_queue`) prevented a render storm: a fragile invariant that nothing tested. (3) Thumbnails, print previews and organize-grid renders were blocked for that page for ever, so a page that failed at one zoom never even got a thumbnail. (4) Nothing told the reader the page had been tried more than once. Five decisions came out of the audit. A failure is a record rather than a string. The retries are bounded (two, after 1 s and 4 s) because a genuinely broken page must not cost a render per frame. Only the document view's own demand — a whole-page raster or a tile — can clear a failure when its tag changes; thumbnails and print previews are gated by the same schedule but never clear it, because two kinds of request with different tags would otherwise keep reviving each other for ever. Rotation clears the failure explicitly, because rotating the view does not change the render scale and so would not otherwise retry. And the page says how often it was tried, so a repeated failure is visible rather than mysterious. Re-audit: `waiting_since` is dropped when a failure is recorded, so the 'Still rendering' hint cannot contradict an error; the automatic attempts are counted in the record and stop at three (`attempts` includes the first failure), tested at the boundaries; the export side was checked too — the atomic writer already leaves the target intact — and a new automation test proves a failed export leaves the document open, unchanged and exportable again. Three more findings came out of the re-audit and are fixed with it. A retry that succeeds must clear the record, or the error card would keep covering a page that has drawn — `receive_result` now drops a failed page's record when a whole-page or tile render comes back, and a thumbnail that comes back says nothing about the page itself. A failure reported by a demand other than the one that failed first must not restart the schedule, or a page failing as a page and as a thumbnail in turn could keep reviving itself; only the recorded demand is counted. And the retry needs no new command: zoom and rotate are the existing ways to change the demand, the card names them, and the agent control channel already reports `page_errors` per document. Not changed: a renderer panic inside a worker is still handled by worker replacement, which was already tested."
local_evidence = [
    "cargo fmt --all -- --check passes",
    "The new unit test in crates/ui-egui/src/canvas.rs checks the retry schedule at its boundaries (not due before 1 s, due at 1 s, then 4 s, then never)",
    "crates/ui-egui/tests/viewer.rs::a_page_that_cannot_be_drawn_is_retried_and_leaves_the_others_alone drives a real two-page file whose first page has an empty page box through the shell: only that page is reported, the other open document draws and reports nothing, and a rotation retries the page and counts a fresh attempt",
    "crates/automation/tests/automation.rs::a_failed_export_leaves_the_document_open_and_usable exports into a path that is a file (the error is reported), checks the open documents are unchanged, then exports into a real folder and finds the PNG",
    "python3 docs/implementation/build_backlog.py --check passes, and python3 -m unittest discover -s docs/implementation -p 'test_*.py' passes (51 tests)",
]
verification_limit = "The workspace cannot be built in this checkout (rten 0.26 needs rustc 1.94, the local toolchain is 1.88, and the craft-libs dependency needs the network), so none of the Rust — production or test — was compiled or run here; it is verified by CI or not at all. The Python side was run. Not claimed: a job centre that lists and cancels work in progress; per-document rollback beyond the atomic save; a diagnostics bundle; recovery from a renderer panic beyond the existing worker replacement; and any claim that a transient failure is always recovered — the retries are bounded on purpose, and the page then says so."
ci = "pending"
