ce that can know: a dialog a surface opens during a frame survives the dialog that closed in it, which is a general rule stated once rather than a special case for the wizard. The web build plans nothing and keeps downloading, because a download replaces nothing. What the audit checked on the way: the plan writes nothing (it only stats names), it reduces a path to its file name so a crafted name cannot write outside the folder, a name that is empty or has no extension still gets a destination, the two writers still report the same progress and summary they did, and every new string is in all fourteen catalogs with the asset hashes re-recorded. Not claimed: that a person reads or understands the list, that a file cannot be created between the answer and the write (the window is one item, as in B033), or anything about a batch started by an agent or the command line, which has no prompt and is meant not to."
