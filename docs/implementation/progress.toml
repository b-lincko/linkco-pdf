[task_status.REC-R05]
status = "in_progress"
notes = "B010 holds back an in-place save when the file's bytes differ from what the app loaded or last wrote, offering Save As, Cancel or Overwrite; B012 polls the open files and reports a rewritten, renamed or deleted one once per new situation; B023 states what the other version holds and adds the comparison, so all three choices the recommendation names are in the prompt. B032 closed the command-line half: every file `pdfcraft-cli` writes now goes through one atomic writer (`pdfcraft_platform::staging::replace_file`), so a denied permission, a full volume or a killed process leaves the file that was there untouched instead of a truncated one. R05 remains open for the web build, which has no local path to watch, and for the identity-based rename notice, which needs Unix metadata."

[task_status.REC-B01]
status = "complete"
notes = "B029 closes this: a caller no longer has to infer a working call from an argument list. Every one of the 147 tools is accounted for in crates/automation/src/examples.rs — 26 tools that change an open document carry a worked example in their own schema, 81 that write files, print, sign, run OCR, act on the session or need a second document or a picture carry a stated reason instead (80 of them named in the test suite; redact_clear needs a mark one call cannot have made), and the 40 read-only tools need neither. The examples are not prose: each is a valid call for the schema it sits in, it is applied to a three-page document, the file is saved, the session is dropped, the file is reopened by a session that has never seen it, and the change is checked — rotation, page order and count, labels, title, a bookmark, a comment, a link, a form field, edited and added text, a script, and for doc_protect that the saved file refuses to open without its password. A test fails a new writer that has neither an example nor a reason, so the table cannot drift. What this does not do: it gives one working call per tool rather than a matrix of every argument, and the read-only tools keep their prose descriptions, which are already written."
evidence = [
    "crates/automation/src/examples.rs holds the whole table: 26 examples and 81 reasons, and the table covers every tool in tools.rs exactly once",
    "crates/automation/tests/roundtrip.rs::every_document_changing_tool_is_exempled_or_explained fails a tool that changes a document and has neither an example nor a reason",
    "crates/automation/tests/roundtrip.rs::every_example_matches_the_schema_it_sits_in checks each example against the schema it is published in",
    "crates/automation/tests/roundtrip.rs::every_example_survives_a_save_and_a_reopen applies each example, saves, and checks the change in a fresh session",
    "CI at 6981890: https://github.com/b-lincko/linkco-pdf/actions/runs/41211944172",
]

[task_status.REC-B02]
status = "in_progress"
notes = "B015 gave the command line its stable exit codes and one-line JSON failures; B028 gives the tool interface a version and a kind. `pdfcraft-cli schema` prints the whole tool table under `schema_version` (major.minor, currently 1.0), `--schema-version V` answers whether this build speaks V and exits 3 when the major differs, and the MCP server reports the same version in `initialize` and `tools/list`. `ToolError::kind()` is the stable kind of every failure (usage, unsupported, refused, failed) and the MCP server returns it as `structuredContent.error`. B031 types the engine's reason for refusing an open, so a damaged document reaches an agent as `malformed` and a locked, empty or unsupported one as `failed` with its reason — and the command line's `--script` steps now return the documented exit code 4 for it. B040 added the per-call pin on both surfaces (run --schema-version, MCP _meta.schemaVersion) and B042 the per-step pin inside one --script. Still open: the interface does not read the version back from a caller's config file."

[task_status.REC-B04]
status = "in_progress"
notes = "B030 makes a batch take folders: `paths` may name files or folders, a folder is walked (depth, exclude, include_hidden, follow_links), the output folder is left out so a run cannot process what an earlier run wrote, and a file reached twice — two spellings, two overlapping folders, a link — is processed once. One expansion does that for `action_run`, `ocr_recognize_files`, `batch_plan` and the new `batch_expand`, so a plan, a preview and a run cannot disagree, and the skipped list says what was left out and why. Still open: nothing watches a folder for changes (a watcher needs a thread and a queue in the process that is watching, which is the app's job, and the app has no folder watch either), a batch over a folder is not resumable after a crash, and overlapping *jobs* are not coordinated — the guarantee is inside one list, not across two runs started at the same time."

[task_status.REC-B07]
status = "in_progress"
notes = "B027 bounds what one session will read, write and do at once: a worker count (the machine's cores capped at 8, and used by the one place the crate itself spreads work over pages), an input size limit answered from the file's size before it is read, an output size limit answered before any file is opened, a batch item limit answered before a path is resolved, and a time limit checked between items and, since B041, inside a single item at a page or step boundary, so a file in hand stops where it is instead of running past the limit. Every quota defaults to no limit, so nothing that was allowed is refused now; limits_status reports what is set and what it refused. Still open: the desktop interface sets none of this (the app has its own render pool), and the counts live in memory for the session rather than being persisted."

[task_status.REC-B09]
status = "in_progress"
notes = "B026 gives a session three permission profiles (read-only, project, destructive) and per-action approvals for the destructive tools, enforced at the tool boundary in Automation::call and read by the MCP server when it lists, searches and runs tools. Still open: real interactive approval (a person clicking Allow) — the approvals here are the ones the server was started with, listed by name — and a UI surface for choosing and showing the profile inside the app."

[task_status.REC-B03]
status = "complete"
notes = "B025 lets a destructive batch be inspected before it runs: batch_plan answers the same call action_run and ocr_recognize_files take and says, per input file, where the result would be written, whether a file is already there and would be replaced, what the input holds, and what cannot be undone — writing nothing. B033 built the token half of the approval: a plan carries a digest of its batch and both writers refuse to run anything else, so approving is no longer a promise about the moment the plan was made. B035 built the prompt: Action Wizard and Recognize Text in Files plan the batch when the results folder is chosen, show what would be written and what would be replaced, start nothing until it is answered, and work the plan out again at the answer so a folder that changed under the question is asked about again rather than run — with the writer taking its destinations from the approved plan. The recommendation's three parts are done. What stays outside it and is recorded in B035: no test has a person in it (the tests click, they do not read), a file created between the answer and the writer reaching that item is still written over, and a batch started by an agent or the command line has the token rather than this prompt."
evidence = [
    "B025 — the plan: crates/automation/src/plan.rs describes every input's destination, what would be replaced and what cannot be undone, writing nothing (`crates/automation/tests/plan.rs`)",
    "B033 — the token: `crates/automation/tests/approval.rs::the_run_a_plan_approves_is_the_batch_it_describes` and `::a_token_names_one_batch_and_nothing_else` prove a writer runs only the batch the plan named and refuses anything else",
    "B035 — the prompt: `crates/ui-egui/tests/batch_approval.rs::the_batch_is_shown_and_writes_nothing_until_it_is_approved`, `::a_question_that_is_cancelled_writes_nothing_and_leaves_the_slot_free`, `::a_folder_that_changed_under_the_question_is_not_the_batch_that_runs` and `::a_recognition_batch_names_the_file_it_would_replace_before_it_does`",
    "B035 — the writer writes the approved plan: `crates/ui-egui/src/batch_plan.rs` plans the destinations and `start_action`/`start_recognize_files` take them from the approved plan, so the file written is the file that was shown",
]

[task_status.REC-R04]
status = "complete"
notes = "Complete. B024 gave every job that leaves the interface thread one card, one stop request and one control-channel report. B036 put the Word, HTML and RTF exports on the same footing, B037 did the same for printing (with the spooler's point of no return recorded honestly), and B038 added the ordering the recommendation asked for: a request that would be a second job of its kind is no longer refused, it waits in the centre in order and can be called off before it starts. What remains outside the recommendation as written: a job in hand still finishes before its stop is answered (by design, so a file is written whole or not at all), and the queue lives in memory, so quitting drops what was waiting."
