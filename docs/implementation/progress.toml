[components.B041]
title = "Enforce the session time limit inside a single item (REC-B07)"
stage = "basic"
parent_tasks = ["REC-B07"]
status = "complete"
code = ["crates/automation/src/limits.rs", "crates/automation/src/a11y.rs", "crates/engine/src/ocr.rs", "crates/engine/src/actions.rs", "crates/engine/src/tests.rs", "crates/ui-egui/src/actions_ui.rs", "crates/automation/tests/limits.rs", "docs/mcp.md"]
acceptance = "A session's time limit (--time-limit-ms, item_timeout) holds inside one item, not only between items. In action_run each file's per-step callback stops the action at a step boundary: nothing is saved for that file, the file is reported with \"stopped\" (not \"error\" and not written half-done), the batch result is timed_out: true, the remaining files are \"skipped\", and the audit counts exactly one batches_stopped_by_time. In ocr_recognize_files each file's per-page callback stops the OCR read at a page boundary: the file is reported \"stopped\" with pages_done/pages_total and its output is not written. In ocr_recognize the open document's per-page callback stops the read at a page boundary, the pages read so far are still added, and the result carries timed_out: true. Zero still means no limit and with no limit nothing changes. The engine changes are minimal and shared: actions::run_on's progress callback now returns bool and a stop is the error actions::stopped(i, n), recognisable with actions::is_stopped; Session::recognize_text takes the same progress callback OcrJob::run already had; Budget gains past_deadline, the same check without the audit count. Tests: crates/engine/src/tests.rs proves a run stopped by its progress stops at the step boundary and says where; crates/automation/tests/limits.rs proves a 1 ns limit stops the first batch file inside itself (nothing written, rest skipped, one stopped batch in the audit) and that an unlimited session finishes every file."
audit = "REC-B07's open note said the time limit was not enforced inside a single item. The audit of what existed: Budget::timed_out(started) was asked only between files in the two batch loops (a11y.rs action_run and ocr_recognize_files), while the per-file work already had stop-capable plumbing that was ignored — pdfcraft_engine::ocr::recognize_file takes a progress: impl FnMut(usize, usize) -> bool that OcrJob::run uses to break the page loop (the automation callers passed |_, _| true), and Session::recognize_text hardcoded |_, _| true. actions::run_on's progress returned (), so it could not stop at all. Decisions. (1) Reuse the OCR bool callback rather than inventing new machinery: the batch and single-document OCR paths pass a closure that asks Budget::past_deadline(started). (2) Make the action path stop-capable the same way: run_on's progress is now -> bool, and a stop returns Err(actions::stopped(i, n)) at a step boundary before anything is saved, so a stopped file writes nothing — the same whole-or-nothing rule the job centre's stop follows. (3) recognize_text gains the progress parameter (five call sites updated: the RecognizeText action step and three engine tests pass |_, _| true, the automation single-document path passes the deadline closure, and the desktop actions_ui.rs passes |_, _| true, leaving the app's own stop rule untouched). (4) past_deadline is timed_out without the audit count, so the audit still counts batches stopped, not pages or steps; a mid-file stop counts the batch once by calling timed_out where the between-items check would have been skipped. (5) A file stopped mid-way is reported, never written partially, so a batch still cannot leave a half-written file behind; for OCR the pages read before the stop are still added to the open document in ocr_recognize (an undoable edit), while ocr_recognize_files writes no output file for a stopped input. docs/mcp.md's --time-limit-ms row now says the limit also holds inside one item. Not claimed: OCR mid-file stops exercised end-to-end without models (the test environment has no OCR models, so the engine OCR tests skip; the action_run mid-file stop is the tested path and the OCR wiring is the same callback compiled by CI), a persisted audit, or any limit in the desktop app."
notes = "Bounded part of REC-B07 (bounded worker pools and resource controls), which stays open. This closes its open note 'the time limit is not enforced inside a single item': the limit is now asked at every page of an OCR read and every step of an action, and a stop lands on a boundary — a page or a step — with nothing half-written. Still open in REC-B07: the desktop interface sets none of this (the app has its own render pool and its own stop rule in the job centre), and the audit counts live in memory for the session rather than being persisted."
local_evidence = [
