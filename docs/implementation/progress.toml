[components.B026]
title = "A session may only do what it was started to do"
stage = "basic"
parent_tasks = ["REC-B09"]
status = "complete"
acceptance = "A session can be started read-only, project-scoped or destructive; a read-only session lists and runs only the tools that change nothing, a project session writes only inside its root and runs a destructive tool only when it was started with that tool's name, and a destructive session runs everything as before; a refused call is refused before its arguments are read, names the profile and what would allow it, and changes nothing; and no document — its text, scripts, links, form fields, comments or embedded files — can move a session from one profile to another, because the profile is set where the session starts."
notes = "Bounded part of REC-B09 (MCP permission profiles and per-action approvals), which stays open for an interactive approval step and for showing the profile in the interface. Until now every session could do everything: the MCP server was opt-in and confined by --root, but nothing said that this agent may read but not write, and the destructive/non-destructive hints in the tool table were annotations for clients, not rules the server kept. There is now a Policy (crates/automation/src/policy.rs): a profile (read-only, project, destructive) plus the destructive tools a project session was started with by name. Automation::call checks it first — before the arguments — so the rule holds for pdfcraft-cli run, the MCP server and every direct caller, and a refusal is a ToolError::Refused (exit code 5, the CLI's existing refused kind). The MCP server lists and searches only what the policy allows, so an agent is not invited to call something that will be refused, and its instructions name the profile. pdfcraft-cli mcp takes --profile and --approve (repeatable, or comma-separated). policy_status reports the profile, approvals, counts and refusals so an agent can see its limits. The auditing that came with it found that the two batch writers, action_run and ocr_recognize_files, were not marked destructive at all — profiles that trusted the table would have let them write whole folders — so both are marked now and a test holds them to it. The default stays destructive, so no existing script or agent configuration is silently narrowed; narrowing is something a person asks for."
code = ["crates/automation/src/policy.rs", "crates/automation/src/lib.rs", "crates/automation/src/tools.rs", "crates/automation/src/mcp.rs", "crates/automation/tests/policy.rs", "crates/automation/tests/automation.rs", "crates/automation/tests/hostile_args.rs", "apps/pdfcraft-cli/src/main.rs", "apps/pdfcraft-cli/tests/mcp_profile.rs", "crates/automation/README.md", "docs/mcp.md", "parity/acrobat-features.toml"]
audit = "Started from the recommendation's done-when — read-only, project-scoped and destructive profiles that document instructions cannot escalate — and asked what \"permission\" can even mean in this program today. The answer: a root (--root) that confines paths, MCP annotations that tell a client which tools are destructive, and nothing else. An agent could delete pages or overwrite the file it had just read, and its only limit was the folder. Four decisions followed. First, the profile is a rule kept by the server rather than advice given to the client: the check sits in Automation::call, the one door every tool call goes through, so it covers the CLI, the MCP server and any library caller, and it runs before the arguments are read — otherwise a caller could learn the schema of a tool it may not use, and a refusal could be masked by a malformed call. Second, the refusal says three things: which profile refused it, what the tool would do, and what would allow it (--approve <tool>, or --profile project/destructive). A refusal that only says no teaches an agent to retry; one that says what would allow it lets the person who started the server decide. Third, approval is by tool name at start-up, not by a token an agent could pass: a PDF cannot approve anything, and the model cannot manufacture consent, which is exactly the escalation the recommendation is about. Fourth, the default stays destructive. Making read-only or project the default would have been the safer-looking choice and the wrong one: every existing script and agent configuration would change behaviour without anyone asking, and a permission change nobody chose is the kind of surprise that gets a safety feature turned off. The profile is named in the server's instructions and in policy_status instead, so it is visible rather than assumed. Re-audit found four things, and the first was the one CI found for it: a read-only session could not open a file at all, because doc_open had never been marked read_only in the table — a profile called read-only that denies reading is useless, so opening is marked as the read it is. The two batch writers were not marked destructive in the table at all, so the project profile would have run them unapproved and the read-only profile would have run them as if they changed nothing — the table now marks both, and a test holds every file writer to it. The project profile could have been taken without a root, which would have promised confinement it had no folder to keep: with_policy now refuses it, and the CLI turns that into a usage error. And search found a second listing path — tool_search in compact mode — which would have advertised refused tools even after tools/list was filtered; it now filters through the same policy, and a name it cannot return says whether the tool is unknown or merely refused. What the audit did not build, and records as a limit: there is no interactive approval (a person clicking Allow, or a token per call) — the approvals are the ones the server was started with, decided by the person starting it; the profile is not shown anywhere in the desktop interface, so someone driving the app by hand cannot see what an agent attached to it may do; and the CLI's own run command has no --profile, because it runs one call in a process the person just typed, where the profile would only repeat the command."
local_evidence = [
    "cargo fmt --all -- --check passes",
    "crates/automation/tests/policy.rs::the_read_only_profile_runs_only_the_tools_that_change_nothing compares a read-only session's own report with the table's read_only flags, reads a document through it, and checks that saving, rotating, a batch run and folder-wide OCR are all refused with a message naming the profile and the tool — and that a refusal comes before the argument check, and that nothing was written",
    "crates/automation/tests/policy.rs::the_project_profile_allows_writes_inside_the_root_and_destructive_actions_only_by_name shows doc_save refused until approved by name, then written inside the root, with the other destructive tools still refused; approvals of an unknown tool, a non-destructive tool and under the read-only profile are errors; and the profile without a root is refused",
    "crates/automation/tests/policy.rs::nothing_inside_a_document_can_widen_the_profile builds a PDF whose text, title property, comment and link URI all order the agent to grant itself every permission, opens it in a read-only session, reads the words back with text_extract, and shows the profile, the refusal list and the four refused calls unchanged — with no output created",
