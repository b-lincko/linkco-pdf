ci_notes = "Verified at b8ee83b by all five workflows at b8ee83b: CI (ubuntu and Windows build, clippy with warnings denied, the whole workspace test suite including the three new scale tests and the strengthened marquee_zoom_and_snapshot, wasm32 check, dependency licences and the docs step), packaging lint, the Windows preview handler, the Windows ARM64 job (native tests, unsigned MSI, install and run) and the FreeBSD build-and-test job, on the first attempt. No test, assertion, deadline or budget was changed to get there. The evidence that matters: the UI test now fails if the copied image is not the size of the same area on screen, which is exactly what the old formula got wrong."
