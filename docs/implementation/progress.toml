[components.B032]
title = "Every file the command line writes is written whole or not at all"
stage = "basic"
parent_tasks = ["REC-R05"]
status = "complete"
acceptance = "Every file `pdfcraft-cli` produces — `edit`, `combine`, `extract`, `split`, `render`, `preview`, `command-batch` and the control-channel screenshot — is written the way the app saves a document: into a private staging file beside the target, flushed to the disk, closed, then renamed over it. A write that fails or is interrupted leaves the file that was already there untouched rather than truncated, leaves no staging file behind, and reports the target's path. A target that is a folder is refused before a byte is written."
notes = "The remainder REC-R05 named for the command line: `pdfcraft-cli edit --out` wrote with `std::fs::write`, which truncates the file it is replacing before the new bytes are on disk, and the same call sat in seven other places. The app's save was hardened against exactly this in B001–B005; the command line, which is the surface a script runs unattended, was not. `pdfcraft_platform::staging::replace_file` now does the whole sequence from the shared primitives (`create_staging` with an unpredictable 64-bit name and `0o600` on Unix, `sync_staged`), and every output in the CLI goes through one helper, `save_output`. The desktop save and the automation tools keep their own write/flush/rename sequencing rather than moving onto it: their tests inject a failure at each step in turn and need those seams, and rewriting them would trade proven fault coverage for tidiness. Still open in REC-R05: the web build has no local path to watch, and the identity-based rename notice needs Unix metadata."
code = ["crates/platform/src/staging.rs", "apps/pdfcraft-cli/src/main.rs", "apps/pdfcraft-cli/Cargo.toml", "Cargo.lock", "apps/pdfcraft-cli/tests/output.rs", "docs/architecture.md"]
audit = "Started from the sentence REC-R05 left open — `pdfcraft-cli edit --out` writes with `std::fs::write` and checks nothing — and asked what the failure actually costs. Plain `std::fs::write` opens the target with truncation and only then writes, so a full volume, a quota, a denied permission or a killed process leaves the document that was there empty or half-written, and the command line is the tool nobody is watching. The app has been protected against that since B001–B005; the CLI had eight write sites, not one. Four decisions. First, the fix goes in `pdfcraft-platform`, where the staging primitives already are, not in the CLI: a third copy of write-flush-close-rename in `main.rs` would be the copy that goes stale. `replace_file` is the whole sequence for a caller with nothing to prove about the individual steps, and the module's documentation now says plainly which callers use it and why the other two keep their own sequencing. Second, the existing writers were not rebuilt on top of it: the desktop and automation versions have injected write/flush/rename seams that their deterministic fault tests drive (B002, B004, B005), and routing them through one function would either lose those seams or need them threaded through the platform crate. Trading proven fault coverage for tidiness is not a trade this component is allowed to make, and the honest note is in the module docs instead. Third, every output, not only `edit`: leaving `combine`, `extract`, `split`, `render`, `preview`, the batch report and the control-channel screenshot on `std::fs::write` would have made the promise true of one command and false of seven, which is worse than not promising it. Fourth, no silent behaviour changes were smuggled in with it: the folder is not created (a missing `--out` folder failed before and still fails; `split` creates its own `--out-dir` explicitly, as it did), and the target's path is still the prefix of the error message. What the audit found and decided: a target that is a folder is refused up front by `replace_file` (with `IsADirectory`) instead of failing at the rename, because staging beside a folder path is not a thing anyone meant to ask for; the file handle is dropped before the rename, which Windows requires; a failed write or a failed rename removes the staging file, so a private full copy of a document is never left in the user's folder; and the mode consequence was written down rather than glossed over — on Unix the staging file is created `0o600` and keeps that mode through the rename, so a file the CLI writes is private to its owner, and replacing a read-only file now succeeds where truncating it used to fail, because replacing needs only the folder's permission. Both are the app's existing save semantics, applied consistently, and both are in the verification limits. Clippy and formatting were run here; the tests could not be, because this checkout has no buildable toolchain (see verification limit)."
local_evidence = [
    "cargo fmt --all -- --check passes",
    "crates/platform/src/staging.rs::replace_file_writes_replaces_and_leaves_no_staging_file writes a new file, replaces it with longer bytes, and then asserts the folder holds only the target — a staging file left behind is a full copy of a document under a name the user did not choose",
    "crates/platform/src/staging.rs::replace_file_refuses_a_folder_and_writes_nothing_beside_it asserts the error is `IsADirectory`, that the folder is still a folder and that no staging name was created beside it",
    "apps/pdfcraft-cli/tests/output.rs::an_overwritten_output_is_the_new_file_and_nothing_else_is_left puts a 4 KiB file at the output name, runs `edit --out` over it, and asserts the result is a complete PDF that ends in `%%EOF`, that the old bytes are gone, and that the folder holds exactly the input and the output",
    "apps/pdfcraft-cli/tests/output.rs::a_write_that_cannot_happen_leaves_the_file_that_was_there makes the folder read-only (Unix, skipped when running as root, with a probe rather than an assumption), runs `edit --out`, and asserts the command failed, named the file, left the previous bytes exactly as they were, and left no staging file",
    "grep: `std::fs::write` appears in apps/pdfcraft-cli/src/main.rs only in the doc comment of the helper that replaced it — all eight call sites now go through `save_output`",
]
verification_limit = "The workspace cannot be built in this checkout (rten 0.26 needs rustc 1.94, the local toolchain is 1.88, and no crate registry is reachable from it), so the Rust was compiled and run by CI, not here: the Python gates and the formatting check are the local evidence. The failure test drives a real denied write (a read-only folder), not a full volume, a killed process or a power cut; `std::fs::write` would have failed the same assertion by truncating the target first, but that was not run against the old code in this checkout. Windows cannot make a folder unwritable in the way that test needs without an ACL dance, so the denied-write case is Unix-only there; the replacement test runs everywhere. Not claimed: fsync semantics on network filesystems beyond what `sync_staged` already does for the app (macOS plain-`fsync` fallback included), atomicity across two files at once, a durable-folder sync after the rename (the rename itself is not flushed to the folder), an overwrite prompt (the CLI replaces what it is told to replace), and the rest of REC-R05."
