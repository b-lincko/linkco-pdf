    "crates/ui-egui/tests/control.rs::a_file_that_changed_on_disk_is_reported_with_the_held_save reads the disk state and the held save back through the control channel",
    "python3 docs/implementation/build_backlog.py --check passes, and python3 -m unittest discover -s docs/implementation -p 'test_*.py' passes (51 tests)",
    "All 247 recorded asset SHA-256s match their files, including the sixteen edited catalogs",
