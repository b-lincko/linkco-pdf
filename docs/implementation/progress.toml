[components.B037]
title = "Print jobs are jobs in the centre, with a stop that is honest about the spooler"
stage = "basic"
parent_tasks = ["REC-R04"]
status = "complete"
acceptance = "Printing a document is a job like any other: while the sheets the spooler needs are rendered, the row in the centre names the sheet it is on and how far it has got, and one stop stops that job and no other. A stop answered before the spooler takes the job sends nothing at all, so there is no print job in the printer's queue to cancel; once the spooler has the job the row stays and says it is sending, and its Cancel is withdrawn rather than offered for a stop that cannot happen. The spooler's answer, a stop and a failure each end the row with the words the notices already used, and a worker that dies without reporting ends its row instead of leaving it spinning."
notes = "The last part of REC-R04's own scope (REC-R04 still carries the queue). Printing already left the interface thread — on Windows every sheet is rendered at the printer's resolution before the spooler gets it — but it reported through the notice bar, so a progress sentence was replaced by any other notice, and nothing could be stopped at all. Now the print is a job in the centre: the rendering asks between sheets (a new engine hook, render_imposed_sheets_with, which the old render_imposed_sheets is expressed in terms of), the row says which sheet is being rendered, and one stop stops it. What made this different from the other five kinds is that a print has a point of no return: once the spooler has the job this app cannot recall it, and the system queue is not ours to empty. The job centre grew the honest answer to that (Jobs::hand_over): from that moment the row keeps its job and its stage but offers no Cancel, cancel refuses rather than recording a stop nobody will answer, and a stop that arrived a moment too late is cleared instead of showing Cancelling… for ever. The control channel reports the same fact as stoppable, and ui.jobs says a handed-over job can no longer be stopped rather than that it is not running. Four new strings (the job's name, the preparing stage, the sheet stage and the stop's sentence) are in all sixteen catalogs and the asset hashes re-recorded. Print jobs now run with their own thread each, so two prints can be in flight at once; the browser keeps its old path, which computes in place and downloads."
code = ["crates/engine/src/lib.rs", "crates/engine/src/tests.rs", "crates/ui-egui/src/jobs.rs", "crates/ui-egui/src/print_ui.rs", "crates/ui-egui/src/widgets.rs", "crates/ui-egui/src/control.rs", "crates/ui-egui/src/i18n/*.tsv", "parity/acrobat-features.toml", "ATTRIBUTION.toml"]
audit = "Started from the sentence REC-R04 has carried since B024 — print jobs still run on their own thread with no row in the centre and no single stop — and asked what 'a stop' can honestly mean for printing, where a spooler is involved. Four decisions came out of it. (1) A print has a point of no return. Rendering the sheets is ours and can be stopped between sheets; handing the job to the spooler is not, because lp and the Windows print queue belong to the system. The component therefore splits the promise: before the hand-over a stop is real and leaves nothing behind (no file, no queue entry), after it the row keeps the job but withdraws the stop instead of offering one that would be ignored. That is what the new Jobs::hand_over records, and the card and the control channel both read it, so a person and a script see the same fact. (2) The rendering needed a boundary to stop at. render_imposed_sheets rendered every sheet in one call, so the only options were 'wait' or 'nothing'; it now has a sibling, render_imposed_sheets_with, that asks before each sheet, and the original is that call with an answer that never refuses — one implementation, so the sheets cannot differ between the two. An engine test proves the ask is called before every sheet with the right numbers, that a refusal renders nothing further, and that the sheets it does produce are the same bytes either way. (3) The status a worker writes and the row the centre draws had to be two different things, because they change at different moments: the card must show the sheet being rendered (which the worker knows) and the hand-over (which happens on the worker but changes what the card offers). The status carries rendered, total and handed_over, and the poll turns those into the row's stage, fraction and stoppability each frame. (4) What counted as evidence. There is no printer in CI, so nothing here sends a job to a spooler; what is tested is the seam and the truth of the row — the ask that refuses the first sheet and the one that refuses the third, a pre-cancelled token that reaches the hand-over and returns stopped, the row's three states (rendering, sending with no Cancel, done), a stop that ends with 'nothing was sent', a failure that ends with the spooler's own words, and a worker that died leaving no row behind. Things the audit checked on the way: the wasm build keeps its in-place path and the new desktop pieces are compiled out of it; the old channel-per-job plumbing (which could only report, never stop) is gone rather than left beside the new one; a print job's label is the printer it goes to, so two prints are told apart; and the four new strings are in all sixteen catalogs with the hashes re-recorded, checked against every entry before writing this time."
local_evidence = [
    "cargo fmt --all -- --check passes",
    "The job-centre module compiles and its tests run on their own (rustc --test on crates/ui-egui/src/jobs.rs, the only dependency being std): 10 passed, including the new a_handed_over_job_refuses_the_stop_and_keeps_no_stopping_state",
    "crates/engine/src/tests.rs::print_sheets_can_be_stopped_between_sheets: a stop before the first sheet is asked once and renders nothing, a stop before the third is asked with two sheets done and refuses the third (which is not rendered), and never refusing gives the same sheets as render_imposed_sheets byte for byte",
