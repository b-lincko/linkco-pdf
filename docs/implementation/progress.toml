    "apps/pdfcraft-cli/tests/mcp_errors.rs::the_compact_meta_tools_carry_the_kind_too checks unsupported through tool_call, usage through tool_search, and refused for a tool the profile hides from tool_search",
    "python3 docs/implementation/build_backlog.py --check passes, and python3 -m unittest discover -s docs/implementation -p 'test_*.py' passes",
