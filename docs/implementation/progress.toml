[components.B031]
title = "A file that is not a document says so"
stage = "basic"
parent_tasks = ["REC-B02"]
status = "complete"
acceptance = "A call that names a file which is not a document that can be read fails with the kind `malformed`, and nothing else does: a missing file, a document locked by a password, a document with no pages, one whose encryption this build cannot read, and a fault of the session itself stay `failed`, each with a message that says which it is. The same word reaches every surface — `ToolError::kind()`, the MCP server's `structuredContent.error.kind`, the exit code of a `pdfcraft-cli --script` step (4), and a batch plan's `targets[].problem` — so a plan, a script and an agent cannot disagree about one file."
notes = "Bounded part of REC-B02 (machine-readable failures), which B015 (stable exit codes) and B028 (a versioned tool table and a kind for every failure) started. The remainder the record itself named was this: the engine's failures were not typed, so a damaged document reached an agent as `failed` with prose, and the command line only decided `malformed` for the commands that open a file itself — a `--script` step that met one reported `failed` (1) and told the script to retry something that can never work. Now the engine says whose problem an open failure is (`pdfcraft_render::OpenError`): `Invalid` is the bytes, `NeedsPassword`/`WrongPassword` are the caller's, `Empty` is a real document with nothing in it (split out of `Invalid` by this component, because a valid file with no pages was being called unreadable), `Unsupported` is this build's limit, and `Internal` is ours — a panic inside the open is no longer reported as a damaged file. `ToolError::Malformed` carries the first of those; `open_problem` is the one place that naming happens, so `doc_open` and a batch plan's per-file facts cannot disagree. Still open in REC-B02: no per-call schema negotiation, and the interface does not read or show the version to the user. Also not typed here: the per-file errors of a batch that ran (`action_run`, `ocr_recognize_files`) are still messages in a result list rather than kinds, because the call as a whole succeeds with some files reported."
code = ["crates/render/src/lib.rs", "crates/render/src/inspect.rs", "crates/engine/src/lib.rs", "crates/engine/src/tests.rs", "crates/automation/src/lib.rs", "crates/automation/src/plan.rs", "crates/automation/tests/automation.rs", "crates/automation/tests/schema.rs", "crates/automation/README.md", "apps/pdfcraft-cli/src/main.rs", "apps/pdfcraft-cli/tests/exit_codes.rs", "docs/api-stability.md"]
audit = "Started from the sentence REC-B02 left open and from the promise `docs/api-stability.md` already made — `malformed` for input that is not a document — then asked which of the two was wrong: the promise, or the code. The code was. Four decisions. First, the classification has to come from the engine, not from the message: matching prose would be a guess that breaks silently the next time a message improves, so the variants of `OpenError` were made to say whose problem a failure is, and `open_problem` only renames them. Second, `malformed` must accuse the file and nothing else, so every other reason had to be separated rather than lumped in: a locked document is the caller's to fix (they have the password), a document with no pages is a real document (this was an actual false accusation — `Invalid` said the file was not a readable PDF when it was a readable PDF with an empty page tree), an unsupported encryption is this build's limit, and a panic inside the open is our bug. That last one used to be reported as `not a readable PDF: reading it failed unexpectedly`, which blamed the file for a fault of ours; it is `Internal` now and reaches the caller as `failed`. Third, one word must reach every surface, or the interface is only as honest as its least updated corner: `kind()` (and so the MCP server, which passes it through), the command line's exit code for a `--script` step, and a plan's per-file facts, which now carry `problem` with the same word before the run, so a batch cannot promise a file it will then refuse. Fourth, the exit-code table was already documented: a script had to handle 4, but only some commands produced it. Fixing the tool boundary rather than documenting an exception keeps the table true. What the audit checked and found: `ToolError` is matched exhaustively in the command line, and one test listed every variant — both updated rather than left to a wildcard, so a new kind cannot slip past silently; `OpenError` gained two variants and its two other matchers (the command line's preview handler and the app's open) have catch-alls, so a locked or empty document reaches them as before; no tool other than `doc_open` opens a file it was given — the batch writers read bytes and hand them to the engine's action runner, which reports per file, and `doc_save` writes — so nothing else changed kind; and a document with no pages could only be reached through `inspect`, because `Session::open` calls it first, so the split is one place with one test. One thing the audit kept deliberately: a file that crashes the parser is still `malformed`, because bad input is the likeliest cause and the message already says the parser crashed; only a panic with no evidence about the file at all — the session's own guard — is `Internal`. Not claimed: the per-file errors of a completed batch are still prose in a result list (the call succeeds, some files are reported), a client that ignores unknown kinds must treat `malformed` as `failed` rather than break, and none of this changes what a message says for any file that opened successfully."
local_evidence = [
    "cargo fmt --all -- --check passes",
    "crates/automation/tests/automation.rs::a_file_that_is_not_a_document_is_malformed opens a text file and a PNG renamed to .pdf and gets `malformed` from each, with the file named in the message; a missing file and a document with an empty page tree in the same test stay `failed`, the second saying it has no pages; and the session still holds no documents afterwards, so neither attempt opened anything",
    "crates/automation/tests/automation.rs::protecting_through_tools asserts that a locked document opens with `Failed` whose message says it is protected by a password: the caller can fix it by saying the password, so the file is not called damaged",
    "crates/automation/tests/schema.rs::every_failure_kind_is_the_one_documented adds `malformed` to the documented vocabulary and checks no two kinds share a name",
    "crates/automation/tests/batch_folder.rs::a_plan_says_which_file_it_could_not_read_and_why plans a batch holding a file that is not a PDF and one with no pages, and gets `problem: malformed` for the first (with no page count and a note that the run would fail) and `problem: empty` for the second, while a readable file carries no problem at all and the tree is unchanged afterwards",
    "crates/engine/src/tests.rs::a_document_with_no_pages_is_empty_rather_than_damaged asserts a page tree with no pages is `Empty` and bytes that are not a PDF at all are `Invalid`, so the app and the tool boundary can tell them apart",
    "apps/pdfcraft-cli/tests/exit_codes.rs::a_damaged_file_reaches_a_script_as_malformed runs `--error-format=json run --script` with one `doc_open` step on a damaged file: exit 4, one JSON line, kind `malformed`, and both the step and the file named",
]
verification_limit = "The kind is demonstrated on documents this repository's own fixtures can build (a text file and a renamed PNG, a zero-page PDF, a password-locked PDF) on Linux, Windows, Windows ARM64 and FreeBSD through CI. Not demonstrated: a file that damages the parser so badly it panics — that path reports `failed` as `Internal`, and no fixture here produces one deterministically; a document this build cannot decrypt, which needs a security handler the test corpus does not have; and a client that treats an unknown kind as `failed`. Whether an agent recovers better is a judgement about agents, not something these tests can show."
