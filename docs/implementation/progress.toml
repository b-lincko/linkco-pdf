[components.B029]
title = "Every tool shows a call that works, and the call survives a save"
stage = "basic"
parent_tasks = ["REC-B01"]
status = "complete"
acceptance = "Every tool that changes an open document carries a worked example in its own schema; the example is a valid call for that schema (no unknown keys, every required key present, the types and enum values the schema declares) and it is the same object the schema publishes; applying it, saving the document and reopening the saved file in a session that has never seen it shows the change; and a tool that changes a document without an example states why, with a test that fails a new writer that does neither."
notes = "Bounded part of REC-B01 (complete tool coverage for the shipped GUI workflows), whose done-when is that every claimed headless feature has schema examples and end-to-end save/reopen tests. Before this, a tool's schema said which arguments it took and nothing about what a working call looked like: an agent had to infer one, and the only save/reopen tests were ones someone had thought to write (the page-editing round trip in automation.rs). There is now crates/automation/src/examples.rs — one example per tool that changes a document (26 of them, from page rotation to PDF/A conversion), and a reason for each of the other 81 writers — surfaced as `examples` inside the tool's schema by schema::schema_with_example, so `pdfcraft-cli schema`, `pdfcraft-cli tools` and the MCP server's tools/list and tool_search all show it. The example is single-sourced: the test runs the same object the schema publishes, so the two cannot drift. crates/automation/tests/roundtrip.rs holds three claims: completeness (every writer is exempled or explained, every read-only tool is neither), validity (a small schema check of every example), and the round trip itself (open a three-page fixture, apply the example, save, drop the session, reopen the file in a new session, check the effect). The example is a new key in every tool's schema, which is an addition a caller may ignore, so the schema version goes to 1.1 by the rule B028 wrote down — and the tests ask the constant rather than a literal, so nothing else moved."
code = ["crates/automation/src/examples.rs", "crates/automation/src/schema.rs", "crates/automation/src/lib.rs", "crates/automation/src/mcp.rs", "crates/automation/tests/roundtrip.rs", "crates/automation/README.md", "docs/mcp.md", "docs/api-stability.md", "parity/acrobat-features.toml"]
audit = "Started from REC-B01's done-when and from what a caller actually lacks: not a longer description of each tool — those are already written — but a call it can believe. Four decisions. First, an example is a *claim*, so it has to be executed: every example is run, saved, reopened in a session that has never seen the document, and checked, which is the only version of \"documented\" that survives refactoring. Second, the example lives in the schema rather than in docs, and the test consumes the published object rather than a copy, so there is one place to be right. Third, completeness had to be enforced, or the table would cover what was easy and miss what was added later: every non-read-only tool must have an example or a stated reason, and the test fails on a writer that has neither — the same shape the B026 policy audit used for the destructive flags, for the same reason (a table nobody checks drifts, and the drift is invisible). Fourth, the fixture is shared and described in the module: a three-page PDF opened as document 1 reading \"Page 1\", \"Page 2\", \"Page 3\", so every example reads alike and a reader can run them in order. Writing the examples was itself an audit of the schemas: it turned up tools whose arguments are not guessable (redact_mark takes a rect, or a find, or a pattern, or whole_pages), tools that need something before they make sense (measure_distance needs a scale), and tools whose name suggests the document but which write a file instead (doc_reduce, doc_optimize). What the audit decided not to do, and records as a limit: no examples for the read-only tools (they change nothing, so there is nothing to save), no example for the 81 writers that write files, print, sign, run OCR, act on the session or need a second document or a picture — a fabricated example for, say, sign_document would be a lie, and 80 of them are named in the test suite (the eighty-first, redact_clear, needs a mark to remove, which one call cannot have made first, and its reason says so); the default round-trip check for the remaining tools is the invariant every edit must keep (three pages, each still reading its own text), while the tools with a visible effect assert that effect (rotation, page order, labels, a bookmark, a comment, a link, a field, edited text, a script); and the examples are illustrations of a working call, not a matrix of every argument."
local_evidence = [
    "cargo fmt --all -- --check passes",
    "crates/automation/tests/roundtrip.rs::every_document_changing_tool_is_exempled_or_explained walks the table and requires exactly one of an example or a reason for every tool that changes a document, and neither for a read-only one",
    "crates/automation/tests/roundtrip.rs::every_example_matches_the_schema_it_sits_in checks every example against the schema it is published in (unknown keys, required keys, types, minimum, enum) and that the published example is the table's own object",
    "crates/automation/tests/roundtrip.rs::every_example_survives_a_save_and_a_reopen runs all 26 examples on a three-page document, saves, drops the session, reopens the file in a new one and checks the change: rotation, page order, page count, labels, title, a bookmark, a comment, a link, a form field, edited text, added text, a document script — and for doc_protect that the saved file refuses to open without its password",
    "crates/automation/src/examples.rs::tests checks the two tables never both describe one tool, and that every example is an object naming document 1",
    "The published examples appear in the same place for all three readers: pdfcraft-cli schema, pdfcraft-cli tools and the MCP server's tools/list and tool_search (schema::schema_with_example)",
    "python3 docs/implementation/build_backlog.py --check passes, and python3 -m unittest discover -s docs/implementation -p 'test_*.py' passes",
    "All recorded asset SHA-256s match their files",
]
