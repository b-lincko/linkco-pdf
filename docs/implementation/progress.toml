ci_notes = "Verified at 4e21920 by all five workflows: CI (ubuntu and windows build, clippy with warnings denied, the whole workspace test suite including the ten new tests, the wasm32 check and the dependency-licence job), FreeBSD build-and-test, Windows ARM64, packaging lint and the Windows preview handler. Four rounds of faults, all this component's own, and what each one taught: the first build refused `BatchOutcome::default()` because the derived Default asks a generic E for Default, so the loop builds the empty outcome field by field; the export stop test then failed on its own count assertion and turned out to be right — `run` answered the stop before storing the page in hand, so the card said 0 of 2 after one file had been written, and the count now goes in first; the Czech catalog test refused a translation that begins with a space, which the stopped-after note does because it is a suffix, so that entry stays out of the Czech catalog (which covers the menus) and is in the other fifteen; and the card test could not make a synthetic click on a Cancel label take effect — neither on one of two identical labels nor on the single one left, with a document open — while the optimizer card test's click on a one-job card works, so the multi-row test drives the stop through cancel_job, the call show_progress makes with the clicked row's id, and the click itself stays with the optimizer test. No behaviour claim was weakened: the batch stop contract, the card's states and the control channel all pass, and the four faults are recorded above as they happened."
