[components.B025]
title = "Say what a destructive batch would write before it writes it"
stage = "basic"
parent_tasks = ["REC-B03"]
status = "complete"
acceptance = "Before a batch that writes files runs, the reader can ask what it would do and get, for every input, the exact file the run would write (the name it would pick, including a numbered one when the plain name is taken), whether a file is already there and would be replaced, what the input itself holds (size, pages, title, whether it is encrypted or unreadable), and what about the run cannot be undone — with nothing written, no folder created and no document touched; the answer carries the call that would carry the plan out, and the names in it are the names the run then picks."
notes = "Bounded part of REC-B03 (dry-run and destructive-operation approval plan), which stays open for showing the plan in the interface and for an approval step. Two automation tools take a list of files and a folder and write a result for each: action_run (an Action Wizard run) and ocr_recognize_files (a searchable copy). Both could only be discovered by running them on real files, and — found later, when REC-B09's profiles came to read the table's destructive flags — neither was even marked destructive, so a profile that trusted the table would have let both write files while believing they changed nothing; B026 marks them. batch_plan now answers the same call and writes nothing: the destination of every input, whether it would replace a file (with the file named), the input's size, pages, title, encryption and repair notes, the steps an action would run over it (or what OCR would change), a list of what cannot be undone, and an approve block holding the exact tool call that would do it. The naming rule is shared, not copied: batch_input_name and action_output are the functions the writers themselves call, action_run reuses the same action parser the plan uses (plan::action_from_args), and a test runs the plan's own approve call and checks the run picks the same names. Reading is capped at 32 MiB per input (plan::PLAN_READ_LIMIT, the same budget the interface gives the other version of a saved file) so a huge file is planned from its size and destination without being loaded. What this cannot promise: the folder's contents can change between the plan and the run (the plan says what is true when it is asked), and the approval itself — a token, a prompt, a confirmation the interface draws — is not built here."
code = ["crates/automation/src/plan.rs", "crates/automation/src/lib.rs", "crates/automation/src/a11y.rs", "crates/automation/src/tools.rs", "crates/automation/tests/automation.rs", "crates/automation/README.md", "docs/mcp.md", "parity/acrobat-features.toml"]
audit = "Started from the recommendation's done-when — users inspect targeted paths, pages and metadata and irreversible changes before execution — and asked which destructive calls in this build a reader can inspect before running. Two answers came quickly: none, and the two that most need it are the batch writers, because they write a whole folder of files at once and their output names are chosen by the run, not by the caller. Four decisions followed. The plan is a tool rather than a flag, because a flag on action_run would still have to be trusted to skip the writing, while a read-only tool that shares the writers' naming code cannot drift from them; the shared functions are batch_input_name and action_output, and a test proves the plan's own approve call lands where the plan said. The plan is read-only in the tool table, which is what the MCP layer reads to tell an agent a call changes nothing, and it is tested to leave the tree byte-identical — no folder created, no output written. It reports what it knows and refuses to guess: an input that is missing, unreadable, or unopenable without a password is a per-file note saying the run would fail on it, and a file over the read cap is described by size and destination with its pages left unknown rather than loaded to be counted. And the destination is described with its context — whether the folder exists, whether a file is already there, and what that means (a replaced file cannot be brought back, because nothing in this path keeps a copy) — because \"writes 3 files\" is not a warning, while \"replaces results/a.pdf, which is already there\" is. Re-audit found four things. First, the plan and the run disagreed about a repeated file name: two inputs called report.pdf both went to report.pdf in a first draft of the plan, while the run writes report.pdf and then report (2).pdf — a plan that promises a file the run will not write is the one failure this component exists to prevent, so the run's numbering now takes the names an earlier input already claimed, and a test runs the plan's approve call to prove both files land where the plan said. Second, an OCR batch writes under the input's own name, so a repeated name there is not a number but a replacement of the earlier input's result, and the plan says so. Third, a path outside --root now refuses the plan outright: OCR refuses the whole call for one, and describing a batch that cannot be carried out would be as misleading as describing it wrongly. Fourth, two duplications in the code it touched. The action parser was about to exist twice, once in action_run and once in the plan, and a plan that parsed a different action than the run would be exactly the lie this component exists to prevent, so both now call plan::action_from_args. And the output-name logic in action_run was inline (a target check plus an unused-name search), which the plan would have had to re-implement; it is now one function that both call (action_output, which action_run calls with no names taken and the plan with the ones it has already promised). What the audit did not do, and records as a limit: the interface's own Action Wizard and Recognize Text in Files dialogs still start their runs without showing this plan, because that surface has no place for a confirmation yet; this component makes the plan available and truthful, and REC-B03 stays open for putting it in front of the reader."
local_evidence = [
    "cargo fmt --all -- --check passes",
    "crates/automation/tests/automation.rs::batch_plan_names_the_files_the_run_would_write_and_writes_nothing plans a three-input action run, proves the tree is unchanged afterwards, checks every destination and the pages and bytes taken from the files themselves, and then runs the plan's own approve call and gets the names the plan promised, including the a (2).pdf chosen because a file was already there",
    "crates/automation/tests/automation.rs::batch_plan_reports_the_files_it_would_replace plans an OCR batch over a folder holding one earlier result and gets that file named as replaced, with the reason a replaced file cannot be brought back and what OCR's settings would do, while the planted file's bytes are untouched",
    "crates/automation/tests/automation.rs::batch_plan_refuses_what_it_cannot_plan covers an unknown operation, an empty path list, an action that is neither named nor given steps, a name that is not a built-in action, an unknown step, an unsupported OCR language and a path or folder that leaves the root — and checks the tool is registered read-only and non-destructive and that a refused plan created no folder",
    "crates/automation/tests/automation.rs::batch_plan_numbers_a_repeated_input_name_as_the_run_does plans two inputs called report.pdf, gets report.pdf and report (2).pdf, runs the plan's own approve call and gets those two files, then plans again over the folder and gets report (3).pdf and report (4).pdf",
    "crates/automation/tests/automation.rs::batch_plan_reports_a_repeated_input_name_in_an_ocr_batch shows a repeated name in an OCR batch reported as a replacement of the earlier input's result, with no folder created",
    "crates/automation/tests/automation.rs::batch_plan_takes_malformed_arguments_without_panicking shoots every argument with a null, array, object, number, string or wrong-typed value and asserts no call panics; the existing hostile-argument and root-confinement suites also run batch_plan",
    "python3 docs/implementation/build_backlog.py --check passes, and python3 -m unittest discover -s docs/implementation -p 'test_*.py' passes",
    "All 247 recorded asset SHA-256s match their files",
]
verification_limit = "The workspace cannot be built in this checkout (rten 0.26 needs rustc 1.94, the local toolchain is 1.88, and no crate registry is reachable from it), so none of the Rust was compiled or run here: the production code and all seven tests were compiled and run by CI (see ci). The Python side, the formatting check and the asset hashes were run here. Not claimed: the same plan shown in the interface before a dialog's run (REC-B03 stays open for it), an approval step that can refuse (this only describes; the caller still decides), and a guarantee against the folder changing between the plan and the run — the plan is a statement about the moment it is asked, not a lock on the folder."
