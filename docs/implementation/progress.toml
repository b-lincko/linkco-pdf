ci_notes = "Verified at 3679df3 by all five workflows: CI (ubuntu and windows build, clippy with warnings denied, the whole workspace test suite including the two new canvas tests and the new automation test, the wasm32 check and the dependency-licence job), FreeBSD build-and-test, Windows ARM64, packaging lint and the Windows preview handler. Four faults were found by CI on the way and fixed: the twenty in-crate queue-test call sites did not name the frame clock the admission now reads (clippy, lib test), sixteen edited translation catalogues no longer matched their recorded SHA-256 in ATTRIBUTION.toml (the assets test, which now passes for all 247 assets), and the new retry test twice asserted against its own scaffolding rather than the code — a result is stamped with the frame's clock, which a default context leaves at 0 s, and the refusal closure carried the first request rather than the one it answers. Each of those was a fault in the test or the bookkeeping, not in the behaviour the test exists to check; the behaviour tests passed unchanged once the scaffolding was right."
