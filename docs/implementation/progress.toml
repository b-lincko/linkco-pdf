    "crates/ui-egui/src/export_ui.rs::a_word_export_runs_as_a_job_and_writes_one_file: an inline Word export finishes in the call, leaves no row behind, writes a file that starts with `PK` (a Word package) and says where it went",
    "crates/ui-egui/src/export_ui.rs::a_stopped_export_writes_nothing_and_says_so: a worker that reported a stop leaves no file, says `Export cancelled`, and retires its row",
    "crates/ui-egui/src/export_ui.rs::an_office_export_whose_worker_died_writes_nothing_and_retires: while the worker runs the card stays and its stage reads `Exporting… page 1 of 3`; when the worker ends without reporting, the run ends with the shared sentence instead of spinning",
    "crates/ui-egui/tests/compare.rs::export_to_word_html_and_rtf still proves the three formats end to end, now through the job (inline)",
