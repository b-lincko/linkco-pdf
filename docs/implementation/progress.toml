    "crates/automation/tests/automation.rs::file_writing_tools_are_not_read_only now covers the two batch writers as well as the three single-file writers",
    "apps/pdfcraft-cli/tests/mcp_profile.rs::the_read_only_profile_lists_and_runs_only_tools_that_change_nothing starts the real server and compares its tools/list with the table, then checks a refused doc_save and a policy_status that says read-only",
    "apps/pdfcraft-cli/tests/mcp_profile.rs::the_project_profile_needs_a_root_and_approves_destructive_tools_by_name checks the usage errors (no root, unknown tool, non-destructive name) and that the running server lists and refuses exactly the approved set",
    "apps/pdfcraft-cli/tests/mcp_profile.rs::an_unknown_profile_is_a_usage_error names the three profiles in the error",
    "The hostile-argument and root-confinement suites accept the new refusal as an answer, so every tool is still exercised with malformed and escaping arguments",
