[components.B038]
title = "A second job of the same kind waits its turn in the centre instead of being refused"
stage = "basic"
parent_tasks = ["REC-R04"]
status = "complete"
acceptance = "Asking for a job while another of the same kind is running is not an error: the request appears at once as a row in the job centre that says it is waiting its turn, it can be called off there (or on the control channel) before it starts anything, and it begins by itself when the job ahead of it ends — in the order the requests were made. Jobs of different kinds are not held up by each other. A job that waited does exactly what it would have done had it started immediately, with what the reader chose when they asked: the document, the pages, the settings, the folder and the approved plan all travel with the request rather than being re-read when its turn comes."
notes = "The last item REC-R04 named, and the one B024, B036 and B037 each left behind. Before this, a second job of a kind that can only run one at a time was refused with a sentence (Optimization is already running, An action is already running, Text recognition is already running, An export is already running), and the image/text exports had no guard at all, so a second one silently replaced the first one's card. Now every such request gets a row, waits, and runs in turn. The mechanism is in the job centre: a per-kind queue that the frame pump advances (Jobs::is_busy, Jobs::begin_queued, PdfCraftApp::queue_job, PdfCraftApp::pump_queue), with the waiting row cancellable and reported on the control channel as queued. What it does not do is re-run the request from the reader's settings at the moment its turn arrives: each call site snapshots what it needs (the document id and pages for text recognition, the settings and the Remove Hidden Information list for the optimizer, the files and the approved plan for a batch, the export's work or the whole office job), so a queued run does what was asked for, not what the dialog happens to say later. Four strings that only said 'already running' are gone from all sixteen catalogs; two are new (the row's Waiting its turn and the called-off notice). Print jobs keep running side by side: two prints go to two printers, and nothing in the queue forces them to take turns."
code = ["crates/ui-egui/src/jobs.rs", "crates/ui-egui/src/lib.rs", "crates/ui-egui/src/widgets.rs", "crates/ui-egui/src/control.rs", "crates/ui-egui/src/optimize_ui.rs", "crates/ui-egui/src/ocr_ui.rs", "crates/ui-egui/src/actions_ui.rs", "crates/ui-egui/src/export_ui.rs", "crates/ui-egui/src/i18n/*.tsv", "crates/ui-egui/tests/control.rs", "parity/acrobat-features.toml", "ATTRIBUTION.toml"]
audit = "Started from the last clause of REC-R04 — a queue that orders jobs rather than letting each kind run one at a time — and asked what a reader actually loses today. The answer was less a missing feature than four different bad behaviours for the same situation: the optimizer, text recognition on a document, text recognition on a folder and an action each refused the second request with a sentence that left nothing to come back to; the office export refused the second; and the image/text exports did not check at all, so a second export overwrote the first one's state — its card, its job row and its worker's report — and the first worker's result was then read by the second's poll. Decisions. (1) The queue belongs to the job centre, not to each feature, because the rule ('one of this kind at a time, oldest first') is the same rule everywhere and the card and the control channel already read that one list; a queue per feature would be five queues with five notions of order. (2) A waiting job is a real row rather than a note in a feature's state: it can be seen, it can be called off, and an agent sees it on ui.state with queued: true. Its Cancel means 'I withdraw this' and nothing has happened yet, which is exactly why it is honest to offer it. (3) Ordering is per kind, not global: a print does not wait for an optimization, and two prints to two printers are not made to take turns, because there is no resource they share. (4) The queue decides when, never what. Each call site hands over a closure that calls its own start function with owned arguments — the document id and page list, the settings and the discard list, the files and the plan the reader approved, the export's work item, the office job — so a queued run cannot pick up a different document because the reader switched tabs, and cannot write somewhere other than the plan that was approved. Two of those needed a small refactor to be possible at all: start_optimize and start_ocr read the dialog and the active tab, so the part that reads was split from the part that runs, and the queue takes the latter with its arguments. (5) Refusing nothing means the four 'already running' strings stop being true, so they are gone from the catalogs rather than left as dead entries, and the tests that asserted the refusal now assert the waiting row instead — one of them rewritten in this component. What the audit checked on the way: a waiting job does not make its kind busy (otherwise it would deadlock itself), the pump retires a waiting row before starting the work so the work registers its own row and the two cannot disagree, a waiting job that is called off is dropped rather than started, a kind whose job has ended starts its oldest waiter in the same frame the poll noticed the ending (the pump runs after the polls), and a closure that re-queues (because its kind became busy again in between) cannot grow the list without bound — it replaces its own row. Not claimed: that the queue survives quitting (it is in memory), that a stop of a running job is immediate, or that jobs are ordered across kinds."
local_evidence = [
    "cargo fmt --all -- --check passes",
    "crates/ui-egui/src/jobs.rs::a_waiting_job_has_a_row_but_does_not_make_its_kind_busy: a waiting row exists, is stoppable, has done nothing, and does not hold its kind once the running job ends",
    "crates/ui-egui/src/jobs.rs::a_second_job_waits_in_order_and_other_kinds_are_not_held_up: a print of another kind starts in the same pump, the two exports wait, and they start oldest first, one per pump",
    "crates/ui-egui/src/jobs.rs::a_waiting_job_called_off_is_never_started: the request's closure never runs, its row goes, the notice says so, and the running job is untouched (the row is retired by the pump's first pass, so a cancelled waiting job cannot be left behind)",
    "crates/ui-egui/src/widgets.rs::the_card_names_each_state_of_a_job: Waiting its turn, the stage, Cancelling…, and a bare label when there is nothing to say",
    "crates/ui-egui/tests/control.rs::a_waiting_job_is_listed_as_waiting_and_can_be_called_off: ui.state reports queued: true and stoppable: true for the waiting job, ui.jobs cancels it, and only the running job is left",
    "crates/ui-egui/src/optimize_ui.rs::a_second_run_waits_its_turn_instead_of_being_refused: the second optimization gets a queued row and no refusal, the running one still holds its kind, and a frame changes nothing while it runs",
    "python3 docs/implementation/build_backlog.py --check, python3 -m unittest discover -s docs/implementation -p 'test_*.py', check_disclosure.py --check and check_egress.py --check pass",
    "All 247 recorded asset SHA-256s match their files, including the sixteen edited catalogs",
]
verification_limit = "The workspace cannot be built in this checkout (rten 0.26 needs rustc 1.94, the local toolchain is 1.88, and no crate registry is reachable), so the Rust is compiled and run by CI, not here. The queue is in memory: quitting drops what was waiting, with no record that it was asked for. Ordering is per kind, so there is no single global order; a job whose kind is free starts in the frame it is asked for, which is why the queue is only visible when something is actually waiting. A stop of a running job is still answered between items. The wasm build compiles the same module but runs every job inline, so nothing ever waits there."
ci = "passed"
ci_notes = "Verified at 5c1964e by all five workflows: CI (ubuntu and windows build, clippy with warnings denied, the whole workspace test suite including the four new job-centre tests, the control-channel test and the rewritten optimizer test, the wasm32 check and the dependency job), FreeBSD build-and-test, Windows ARM64, packaging lint and the Windows preview handler. Three rounds were red, all this component's own. The first: `has_waiting_jobs` is only ever called by tests, so a build without them saw a method nothing used and the crate refused to compile — it is `#[cfg(test)]` now, which is the truth about it. The second round exposed two tests of mine that asserted more than the design promises. The control-channel test built its waiting row by calling `Jobs::begin_queued` directly, without a request behind it, and expected the pump to retire it when it was cancelled — which showed a real gap rather than only a test fault: the pump only looked at queued requests it was holding, so a waiting row whose stop was asked for could be left saying Cancelling… for ever. The pump now retires every called-off waiting row first, whether or not a request is still behind it, which is the fix the test found. The optimizer test then failed on its last assertion: it expected the queued optimization to report a failure when it started, and the document it used turned out to be optimizable, so the assertion was about the outcome of a real run rather than about the queue — the test now asserts only what this component claims (a waiting row, no refusal, the running job still holding its kind) and leaves the admission itself to the job-centre tests that were written for it. Nothing about what the component claims was weakened to get green."
