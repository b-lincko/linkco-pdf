    "crates/automation/tests/batch_folder.rs::a_folder_is_walked_in_name_order_and_says_what_it_left_out walks a tree of three folders, asserts the exact file list, the folder count, and a reason for the excluded file and the hidden one, then takes the hidden one when asked",
    "crates/automation/tests/batch_folder.rs::the_same_file_reached_twice_is_in_the_batch_once gives one file three times (folder, name, name with `..`) and gets one entry, in the folder's place, with the repeat reported",
    "crates/automation/tests/batch_folder.rs::depth_stops_where_it_is_told_to holds depth 1 and 2 to the exact lists, and refuses depth 0",
