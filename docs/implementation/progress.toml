    "crates/ui-egui/src/print_ui.rs::a_print_job_reports_its_sheets_and_loses_its_stop_at_the_spooler: the row reads Preparing the print job, then Rendering sheet 2 of 4 at 25%, then Sending to Front Desk… with no stop, and the spooler's answer ends the row and is shown",
