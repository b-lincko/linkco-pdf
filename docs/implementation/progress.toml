# Live implementation state. The dated research snapshot remains immutable.
# Change status only with component-specific implementation, audit and test evidence.
[workflow]
order = ["basic", "advanced", "future"]
active_stage = "basic"
active_component = "B029"
confirmation_required_after_each_component = false
auto_advance = false # Stage changes still require explicit approval.
batch_authorized_stage = "basic"
batch_authorization_date = "2026-10-26"
batch_authorization = "ok finish all basic at once, make sure you audit it after coding it."
confirmation_required_before_stage_change = true
steps = ["scope", "implement", "audit", "fix", "reaudit", "test", "push", "verify_ci", "continue_authorized_basic_batch_or_ask_before_next_stage"]
# Completion requires all relevant acceptance tests; no claim of zero unknown bugs.

[task_status.REC-R05]
status = "in_progress"
notes = "B010 holds back an in-place save when the file's bytes differ from what the app loaded or last wrote, offering Save As, Cancel or Overwrite; B012 polls the open files and reports a rewritten, renamed or deleted one once per new situation; B023 states what the other version holds and adds the comparison, so all three choices the recommendation names are in the prompt. R05 remains open: pdfcraft-cli edit --out writes with std::fs::write and checks nothing, the web build has no local path to watch, and the identity-based rename notice needs Unix metadata."

[task_status.REC-B01]
status = "in_progress"
notes = "B029 gives every document-changing tool a worked example in its schema and proves it: the example is valid against the schema it sits in, it is applied to a three-page document, the file is saved and reopened by a fresh session, and the change is checked to be there. A tool that changes a document and has no example carries a stated reason instead, which a test enforces both ways. Still open: the examples cover the tools that change an open document, not the ones that write files, print, sign or run OCR (each of which has its own end-to-end test), and there is no example for the read-only tools."

[task_status.REC-B02]
status = "in_progress"
notes = "B015 gave the command line its stable exit codes and one-line JSON failures; B028 gives the tool interface a version and a kind. `pdfcraft-cli schema` prints the whole tool table under `schema_version` (major.minor, currently 1.0), `--schema-version V` answers whether this build speaks V and exits 3 when the major differs, and the MCP server reports the same version in `initialize` and `tools/list`. `ToolError::kind()` is the stable kind of every failure (usage, unsupported, refused, failed) and the MCP server returns it as `structuredContent.error`. Still open: the engine's errors are not typed, so a damaged document reaches an agent as `failed` rather than `malformed`; there is no per-call schema negotiation; and the interface does not read or show the version."

[task_status.REC-B07]
status = "in_progress"
notes = "B027 bounds what one session will read, write and do at once: a worker count (the machine's cores capped at 8, and used by the one place the crate itself spreads work over pages), an input size limit answered from the file's size before it is read, an output size limit answered before any file is opened, a batch item limit answered before a path is resolved, and a time limit checked between items so the item in hand is finished rather than abandoned. Every quota defaults to no limit, so nothing that was allowed is refused now; limits_status reports what is set and what it refused. Still open: the desktop interface sets none of this (the app has its own render pool), the time limit is not enforced inside a single item, and the counts live in memory for the session rather than being persisted."

[task_status.REC-B09]
status = "in_progress"
notes = "B026 gives a session three permission profiles (read-only, project, destructive) and per-action approvals for the destructive tools, enforced at the tool boundary in Automation::call and read by the MCP server when it lists, searches and runs tools. Still open: real interactive approval (a person clicking Allow) — the approvals here are the ones the server was started with, listed by name — and a UI surface for choosing and showing the profile inside the app."

[task_status.REC-B03]
status = "in_progress"
notes = "B025 lets a destructive batch be inspected before it runs: batch_plan answers the same call action_run and ocr_recognize_files take and says, per input file, where the result would be written, whether a file is already there and would be replaced, what the input holds, and what cannot be undone — writing nothing. B003's approve plan still has to be shown in the interface before an action runs, and the approval itself (a token, a prompt) is not built yet."

[task_status.REC-R04]
status = "in_progress"
notes = "B024 gives every job that leaves the interface thread one card, one stop request and one control-channel report: optimizing, recognizing text in the open document, recognizing text in a folder of files, running an action over files, and exporting all show a stage and can be stopped safely. R04 remains open for print jobs and for the Word/HTML/RTF conversions, which still run synchronously, and for a queue that orders jobs rather than letting each kind run one at a time."

[task_status.REC-R01]
status = "in_progress"
notes = "B001–B007 cover staging names, flush-before-replace, Unix creation modes, controlled operation faults, bounded process-termination/retry checks, retry of failed recovery autosaves until persistence succeeds, and recovery-key validation with metadata filename binding. R01 remains open: physical volume-full, whole-application restart/session recovery, power-loss durability and the full save-integrity release gate are not complete."

