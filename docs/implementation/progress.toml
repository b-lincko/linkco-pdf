[components.B034]
title = "A job whose worker dies ends instead of spinning for ever"
stage = "basic"
parent_tasks = ["REC-R06"]
status = "complete"
acceptance = "A background job whose worker ends without reporting — it panicked, or no thread could be made at all — ends in the interface: its card leaves the job centre, the flag that refuses a second run of that kind is cleared, the reader is told the job stopped without finishing, and the document is left exactly as it was. A job that is merely slow is not touched: no deadline ends it. The same answer holds for all five kinds of background work (optimizing, recognizing text in one document, recognizing text in a batch, running an action over files and exporting), and a worker that cannot be started says so in the same frame rather than waiting for a report that will never come."
notes = "The next part of REC-R06 after B022. B022 made one bad page recoverable; it did not make one bad *job* recoverable. A worker reports by writing its outcome where the poll reads it, and a poll cannot tell not there yet from never coming. If the worker panicked — a renderer refusal that unwinds on one awkward page is the realistic case — or if the thread could not be created, nothing was written, and every poll kept waiting: the card spun for ever, and worse, the flag that refuses a second run of that kind stayed set, so the session answered Optimization is already running, An action is already running or Text recognition is already running for every later attempt, on documents that were fine. The document itself was never damaged (the engine only commits edits that succeed), but the feature was gone until the application restarted. The fix is a lifetime handle (crates/ui-egui/src/jobs.rs): `Alive` is a shared flag, `Worker` is the worker's end of it, and dropping the `Worker` clears the flag — a return and an unwind both drop it, which is exactly the property a deadline cannot have. Each of the five workers now holds one for the length of its work, and each poll asks two things before waiting again: is the worker gone, and did it leave a report behind. Only when both say no — gone, and nothing written — does the job end, so a slow render of one huge page is untouched. A thread that cannot be started now writes the failure into the report instead of being dropped on the floor by `.ok()`, and the one poll that returned silently on a poisoned lock (the worker panicked while holding it) now ends the job and says so. The message is one shared string in every catalog — The job stopped without finishing — because the card already names which job it was."
code = ["crates/ui-egui/src/jobs.rs", "crates/ui-egui/src/export_ui.rs", "crates/ui-egui/src/optimize_ui.rs", "crates/ui-egui/src/ocr_ui.rs", "crates/ui-egui/src/actions_ui.rs", "crates/ui-egui/src/lib.rs", "crates/ui-egui/src/i18n/*.tsv", "crates/engine/src/tests.rs", "docs/architecture.md"]
audit = "Started from the gap REC-R06 named — recoverable per-document operation failures — and asked what happens to a *job* when the code carrying it out fails, as opposed to what happens to a document when an edit fails. The document side is already sound and was re-checked rather than assumed: `Session::apply` clones the editor state, runs the edit on the clone, wraps it in `guard`, and commits only on success, so a refused or panicking edit leaves the document, its dirty flag, its undo stack and its generation untouched — and a new engine test now says so in the terms the recommendation uses, with a second document open beside the failing one and a batch that fails on its second half (one good edit, then a refusal) to prove the good half does not land either. The job side was not sound. Five findings. (1) The interface had no way to tell a worker that had not finished from one that would never report, so a panic in a worker left `optimize_run`, `ocr_run`, `ocr_batch`, `action_run` or `export_status` set for the life of the session, and each of those is also the flag that refuses a second run of the same kind. (2) The first thing a reader would try — start it again — was refused with a message that was true and useless (already running) about a job that no longer existed. (3) Two of the five spawns were `.ok()`, so a thread that could not be created vanished without a word. (4) One poll returned silently when the progress mutex was poisoned, which is exactly the state a panicking worker leaves behind, so the one path that could have noticed the death was the one that said nothing. (5) The patterns were five separate copies, which is how they had drifted. Decisions. The signal is a lifetime handle, not a deadline: a worker that is slow is not a worker that is gone, and any timeout short enough to notice a panic quickly would be short enough to end real work on a large document, so the flag means only what is true — that the worker that was going to report has ended. The poll needs both halves (gone *and* no report) because a worker that ends properly writes its report before its handle drops, and a report without a death is an ordinary success; testing either alone would either retire live jobs or miss dead ones. The retirement path is the same code the failure paths already use — remove the card, clear the state, notify — so there is one way for a job to end, not two. The spawn failures reuse the same report the worker would have written, so the reader sees one sentence shape whatever went wrong, and the two new strings are in all sixteen catalogs. Nothing is retried on the reader's behalf: a panicking page is a genuine failure, and pretending to retry it would hide it. Re-audit: the inline path (tests and the web build, which run the work synchronously on the UI thread) ends the job in the same call, and the handle is already gone by then, so the dead-worker branch is guarded by the report being absent as well — otherwise every inline job would be declared dead in the frame that started it; that ordering is what the unit tests pin. A cancelled job still reports, so cancel is not mistaken for death. The optimize poll checks the handle before it asks the card to draw, so no stage sentence is written for a job that is already over. And the export path lost its duplicated body in the process: the folder-picking closure and the inline path now call one `begin_export`, so the card, the state and the worker's lifetime cannot disagree about which export is running. Not claimed: that a panic is prevented (the crash still happens and is still worth fixing), that a hung worker that never returns is noticed (a live thread that blocks for ever is not a dead one, and nothing here kills it), that the document-level effects of a panic inside the engine were re-proven beyond the existing guard and worker replacement, or anything about a diagnostics bundle, which stays open in REC-R06."
local_evidence = [
    "cargo fmt --all -- --check passes",
    "crates/ui-egui/src/jobs.rs::a_worker_is_running_until_its_own_handle_is_dropped: the flag says running while a handle exists, is cleared when it drops, and a fresh Alive is a fresh worker",
    "crates/ui-egui/src/jobs.rs::a_worker_that_unwinds_has_ended_too: the handle is dropped by an unwind as well as by a return, which is the property a deadline cannot have",
    "crates/ui-egui/src/export_ui.rs::an_export_whose_worker_ended_without_reporting_ends_here: a live worker is left alone; once it is gone with no report the card retires, the job row leaves the centre and the reader is told; a worker that ended *with* a report is the ordinary path",
    "crates/ui-egui/src/actions_ui.rs::an_action_whose_worker_ended_without_reporting_ends_here and ::an_action_that_reports_is_shown_as_it_always_was",
    "crates/ui-egui/src/ocr_ui.rs::a_batch_whose_worker_ended_without_reporting_ends_here and ::recognition_of_one_document_whose_worker_ended_without_a_result_ends_here",
    "crates/ui-egui/src/optimize_ui.rs::an_optimization_whose_worker_ended_without_a_result_ends_here",
    "crates/engine/src/tests.rs::a_refused_batch_leaves_this_document_and_the_one_beside_it_alone: the good half of a failing batch does not land, the other tab keeps its own dirty state and history, and both stay usable afterwards",
    "python3 docs/implementation/build_backlog.py --check, python3 -m unittest discover -s docs/implementation -p 'test_*.py', check_disclosure.py --check and check_egress.py --check pass",
]
