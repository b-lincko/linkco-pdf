[components.B033]
title = "An approval names the batch it approves"
stage = "basic"
parent_tasks = ["REC-B03"]
status = "complete"
acceptance = "A plan carries an approval token, and the two destructive batch writers accept it back: given the token, a run works out the batch it would carry out before it creates the folder or reads a file, and refuses (`refused`, nothing written, not even the output folder) unless that batch is the one the token names — same writer, same folder, same files, same settings, and no output that has appeared since the plan called its name free. A token names one batch only: another folder, another action's steps, another list, another resolution or language, and the other writer are all refused. The call the plan hands back names the files it planned, so a file that appears in a walked folder afterwards is not in the approved batch, and a call that names the folder again is refused as the grown batch it is. A call without a token behaves exactly as it did, and says so (`approved: false`). A token that is not one is a usage error."
notes = "The half of REC-B03 the record itself named after B025: the plan could be read, but the approval was a promise about the moment the plan was made, and a run started a minute later would carry out whatever it found — a file added to a walked folder, the wrong folder argument, another action's steps — while still being described, to anyone reading the plan, as the thing that was approved. Now a plan carries `approval.token`, a SHA-256 digest of what the batch *is* (writer, folder path, the settings that change the output, and every input with the file its result would go to), and `action_run` and `ocr_recognize_files` take it back as `approve_token`. The writers compute the whole target list before creating the folder (crates/automation/src/approval.rs::planned — the same function the plan uses, so the two cannot drift) and compare digests; a mismatch is refused with the number of files this call would write, so the caller can compare it with the plan in hand and plan again. One thing the approval has to say plainly, because it decides what /the same batch/ means: the token covers the expanded list, and the call `batch_plan` hands back names that list's files rather than the folder it walked. So handing the plan's own call back is exact — a file that arrives in the folder afterwards is simply not in the approved batch — while a call that names the folder again asks for the batch as it is now, and a folder that grew is refused with the count of what it would now write. Both halves are tested. The token is deliberately described as what it is: not a secret, not signed, not a permission — it cannot get a call past the session's profile or `--approve` list, and its only job is the drift question. Still missing in REC-B03, and said so in the record, the README and docs/api-stability.md: showing the plan in the interface and asking a person. The token is what such a prompt would hand to the run; the prompt is not built."
code = ["crates/automation/src/approval.rs", "crates/automation/src/plan.rs", "crates/automation/src/a11y.rs", "crates/automation/src/tools.rs", "crates/automation/src/lib.rs", "crates/automation/src/schema.rs", "crates/automation/Cargo.toml", "Cargo.lock", "crates/automation/tests/approval.rs", "crates/automation/README.md", "docs/api-stability.md", "parity/acrobat-features.toml"]
audit = "Started from the gap REC-B03 named — the plan is inspected, but approving it does not bind the run — and asked what an approval can honestly mean for a tool that writes files, given that a person cannot be in the loop in this crate. Four decisions. First, the thing to bind is the batch, not the permission: the session's profile already answers \"may this tool run at all\", so repeating that here would add a weaker copy of an existing check. What was missing was \"is this the batch that was looked at\", which is a claim about drift, and it is the only one the code can make. Second, the digest has to be of what the run would do, not of the arguments the caller typed: `paths` can name a folder, so the same arguments a minute later mean different files. That is why the token covers the expanded list with its destinations, and why the writers compute that list before touching anything — computing it after the first write would make the check describe a batch that had already half happened. Third, one place computes the list for all four users (the plan, both writers, the token): `approval::planned`. The audit found while doing this that the plan and the action writer were already using two different notions of the names a batch takes — the plan passed the names it had promised, the writer passed nothing and relied on the file existing a moment later — which happened to agree for every case the tests cover and would not have survived a folder where the first output is deleted mid-run. The writer now writes the plan's list, so the approval covers exactly the files the answer reports. Fourth, the token is optional and its absence is visible: making it required would break every existing script for a guarantee that a caller can already choose to have, and a caller that gets `approved: false` back knows exactly which mode it is in. What the audit checked: the settings that can change a file's contents are in the digest (action steps, resolution, language, skip_text_pages) and equal by value rather than by spelling, so `300` and `300.0` agree; a folder is bound by its resolved path, so `out` and `./out` are one approval while `out2` is not; an empty or odd-length token is a usage error rather than a mysterious refusal; the OCR check runs before the models are looked for, so the promise holds on a machine without them (and can be tested there); a refused run leaves no output folder behind, which the old code could not promise because it created the folder before the loop; and no token value is ever echoed back in an error message. A second audit, after CI refused two of the eight tests, found both were the tests' fault, and one was a real design question: the drift test offered the token with paths naming the folder and expected a refusal once the folder had grown, but the call a plan hands back names the three files, so that call could not grow — the test was asserting the opposite of what the plan's own arguments do. Both shapes are now tested (the folder-named call is refused, the plan's call is exact); the other failure was a step id (set_author) that does not exist, so that case answered usage instead of refused; and the README and the module docs now say which shape is which. Not claimed: that a person approved anything, that the token cannot be computed by a caller who has the crate, that a plan shown to a human is read or understood by one, that the interface shows a plan at all, and anything about time — an approval does not expire; it stops matching when the batch changes."
local_evidence = [
    "cargo fmt --all -- --check passes",
    "crates/automation/tests/approval.rs::the_run_a_plan_approves_is_the_batch_it_describes checks the token's shape (64 lowercase hex characters), runs the plan's own approve call with it, gets `approved: true`, and gets exactly the planned output files on disk in the planned order",
    "crates/automation/tests/approval.rs::a_call_without_a_token_is_the_call_it_always_was runs the same batch with no token, gets `approved: false` and the same three files",
    "crates/automation/tests/approval.rs::a_token_names_one_batch_and_nothing_else offers one plan's token to another folder, another action's steps, another paths list and the other writer, and gets `refused` each time with a message that says what to do next; the whole tree is unchanged afterwards, and the second folder was never created",
    "crates/automation/tests/approval.rs::a_batch_that_grew_after_it_was_approved_is_not_the_one_that_runs adds a file to the walked folder and checks both shapes: a call that names the folder again is refused with four file(s) and writes nothing, while the plan's own call (which names the three files) is accepted and writes exactly those three, so the fourth is never approved; a fresh plan covers four files with a different token and writes the file that was added",
    "crates/automation/tests/approval.rs::an_output_that_appeared_after_the_plan_makes_the_approval_stale plants a file at the planned destination and asserts the run refuses and leaves that file untouched",
    "crates/automation/tests/approval.rs::a_token_travels_between_spellings_but_not_between_batches approves `out` and runs with `./out`, which is accepted",
    "crates/automation/tests/approval.rs::a_token_that_is_not_one_is_a_usage_error checks empty, three-character, uppercase, 63-character and 65-character tokens: each is `usage` and names approve_token, and nothing is created",
    "crates/automation/tests/approval.rs::a_text_recognition_batch_is_approved_the_same_way plans an OCR batch and gets a refusal for another resolution, before the models are looked for and with nothing created",
    "python3 docs/implementation/build_backlog.py --check passes, and python3 -m unittest discover -s docs/implementation -p 'test_*.py' passes",
]
verification_limit = "The workspace cannot be built in this checkout (rten 0.26 needs rustc 1.94, the local toolchain is 1.88, and no crate registry is reachable from it), so the Rust was compiled and run by CI, not here: the Python gates and the formatting check are the local evidence. The digest is demonstrated on synthetic one- and two-page PDFs, and on the OCR path only as far as the refusal (the models are not installed here or on a CI runner, so an accepted OCR run is not exercised). The tests do not cover two writers running at once, a folder changed by another program between the digest and the write (the window is the length of the batch, and nothing locks the folder), a clock, or a token created by a different version of this crate — the digest includes nothing about the version, so a token from an older build matches if the batch is the same, which is intended but untested."
ci = "passed"
