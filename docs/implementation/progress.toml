ci_notes = "Verified at 5fc1368 by all five workflows: CI (ubuntu and windows build, clippy with warnings denied, the whole workspace test suite including all eight approval tests, the wasm32 check, and the dependency and licence job), Windows ARM64 (native tests), FreeBSD build-and-test, packaging lint and the Windows preview handler. Four earlier rounds on this component were red and all four were ours, each fixed in turn: a compile error, a clippy deref, two test compile errors, then two failing tests that were the tests' fault — a step id that does not exist answered `usage` where the test expected `refused`, and a growth test that expected a refusal from a call that names its files and so cannot grow. The design question behind the second is now answered in writing in three places (this record, the README and the module docs) rather than left to a test. The commits after 5fc1368 touch only docs/implementation (this record and the generated TODO), which no Rust test reads and which the local gates validate."
