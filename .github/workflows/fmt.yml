name: Format (temporary)

# Temporary: run rustfmt and push the result back to the branch, because the sandbox that wrote
# these commits has no Rust toolchain and cannot read CI logs. Remove once the branch is green.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fmt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/25355b3c-linkco-pdf
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Push if rustfmt changed anything
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "arena-agent"
          git config user.email "297053741+arena-agent@users.noreply.github.com"
          git add -A
          git commit -q -m "style: apply cargo fmt" -m "Ran by the temporary Format workflow: the sandbox that wrote these commits has no Rust toolchain."
          git push origin HEAD:arena/25355b3c-linkco-pdf
